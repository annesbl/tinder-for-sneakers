<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE : Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <a href="https://www.one-ai.fashion" class="icon-left">
        <img src="icons/website.png" alt="Website Icon" class="icon-img" />
      </a>
      <h1 class="header-title">ONE : Fashion | Find your shoe</h1>
      <div class="icon-right">
        <img 
         src="icons/bookmark.png" 
         alt="Bookmark Icon" 
         class="bookmark-img" 
         data-filled="icons/bookmark-filled.png" 
         data-empty="icons/bookmark.png"
         style="cursor: pointer;"
        />
      </div>
    </header>    
    <main id="scroll-container"></main>
  </div>
  <script src="script.js"></script>
  <script>
    document.addEventListener("click", function (e) {
      if (e.target.classList.contains("more-btn")) {
        const desc = e.target.closest(".product-line").nextElementSibling;
        const isOpen = desc.style.display === "block";
        desc.style.display = isOpen ? "none" : "block";
        e.target.textContent = isOpen ? "mehr" : "weniger";
      }
    });
  </script>
  
</body>
</html>
